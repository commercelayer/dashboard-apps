packages:
  - packages/*
  - apps/*

verifyDepsBeforeRun: false

allowBuilds:
  esbuild: true
  nx: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@commercelayer/app-elements'
  - '@commercelayer/sdk'
  - '@commercelayer/provisioning-sdk'
  - '@commercelayer/js-auth'

blockExoticSubdeps: false

catalog:
  '@commercelayer/app-elements': 8.2.0
  '@commercelayer/sdk': 8.0.3
  '@hookform/resolvers': '^3.10.0'
  '@testing-library/jest-dom': '^6.10.0'
  '@testing-library/react': '^16.3.3'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^22.20.5'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^5.2.0'
  cronstrue: '^3.31.0'
  date-fns: '^4.4.0'
  dotenv: '^17.4.2'
  i18next: '^25.10.10'
  jsdom: '^27.4.0'
  lodash-es: '^4.18.1'
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: 7.88.0
  react-qrcode-logo: '^4.1.0'
  rollup-plugin-external-globals: '^0.13.0'
  swr: '^2.5.1'
  type-fest: '^5.10.0'
  typescript: '^5.9.3'
  vite: '^7.3.7'
  vite-tsconfig-paths: '^5.1.4'
  vitest: '^4.1.11'
  wouter: '^3.13.0'
  zod: '^3.25.76'
